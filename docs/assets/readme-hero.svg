<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">ESP32-C6 Gateway</title>
  <desc id="description">Telemetria, controle e diagnóstico na Waveshare ESP32-C6-LCD-1.47. Ilustração de um robô e portas dos serviços.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081222"/><stop offset="1" stop-color="#14283d"/></linearGradient>
    <linearGradient id="shell" x2="0.8" y2="1"><stop stop-color="#f0f7ff"/><stop offset="0.55" stop-color="#b0c4db"/><stop offset="1" stop-color="#59748f"/></linearGradient>
    <linearGradient id="face" x2="1" y2="1"><stop stop-color="#19364b"/><stop offset="1" stop-color="#07101f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7b9eb8" stroke-opacity="0.07"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="24" fill="url(#bg)"/><rect width="1280" height="380" rx="24" fill="url(#grid)"/>
  <path d="M0 1H1280" stroke="#49e0cd" stroke-opacity="0.6"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="74" fill="#5ae3d4" font-size="13" font-weight="700" letter-spacing="4">WAVESHARE · ESP32-C6-LCD-1.47</text>
    <text x="60" y="150" fill="#f1f6ff" font-size="66" font-weight="750" letter-spacing="-2">ESP32-C6 Gateway</text>
    <text x="64" y="197" fill="#bed0e3" font-size="24">Telemetria. Controle. Diagnóstico.</text>
    <text x="64" y="232" fill="#8da6c1" font-size="16">Wi-Fi · display · microSD · clima · Prometheus</text>
    <g font-family="Consolas, monospace" font-size="13">
      <rect x="64" y="280" width="138" height="36" rx="9" fill="#16323f" stroke="#285461"/><text x="85" y="303" fill="#73e3d0">UDP :4210</text>
      <rect x="214" y="280" width="136" height="36" rx="9" fill="#182c46" stroke="#304a68"/><text x="235" y="303" fill="#a1c7ff">HTTP :80</text>
      <rect x="362" y="280" width="174" height="36" rx="9" fill="#2b2542" stroke="#51456b"/><text x="382" y="303" fill="#d4b8ff">METRICS :9120*</text>
    </g>
    <text x="64" y="344" fill="#7690ab" font-size="11">* Porta padrão de métricas, configurável no portal.</text>
  </g>
  <g transform="translate(986 190)">
