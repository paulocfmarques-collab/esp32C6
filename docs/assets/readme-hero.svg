    <circle cx="-145" cy="-33" r="5" fill="#54dfd1"/><circle cx="130" cy="72" r="5" fill="#b6a0f7"/>
    <rect x="-113" y="-25" width="27" height="65" rx="12" fill="#708da6"/><rect x="86" y="-25" width="27" height="65" rx="12" fill="#708da6"/>
    <rect x="-108" y="-17" width="7" height="46" rx="3" fill="#8ee9ed"/><rect x="101" y="-17" width="7" height="46" rx="3" fill="#8ee9ed"/>
    <rect x="-95" y="-80" width="190" height="171" rx="58" fill="url(#shell)"/>
    <rect x="-82" y="-54" width="164" height="128" rx="43" fill="#567084"/><rect x="-77" y="-49" width="154" height="117" rx="39" fill="url(#face)"/>
    <path d="M-29-67H28" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-34" cy="5" rx="12" ry="19" fill="#2ee5ec" fill-opacity="0.13"/><ellipse cx="34" cy="5" rx="12" ry="19" fill="#2ee5ec" fill-opacity="0.13"/>
    <ellipse cx="-34" cy="5" rx="7" ry="12" fill="#4af1ee"/><ellipse cx="34" cy="5" rx="7" ry="12" fill="#4af1ee"/>
    <path d="M-15 33Q0 47 15 33" fill="none" stroke="#4af1ee" stroke-width="5" stroke-linecap="round"/>
